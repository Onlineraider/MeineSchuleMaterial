name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.3.1" }
      - name: Konfiguration (Secrets oder Platzhalter)
        run: |
          echo "msd.origin=${{ secrets.MSD_ORIGIN || 'https://meineschule.digital' }}" >> local.properties
          echo "msd.appId=${{ secrets.MSD_APP_ID || 'CI' }}" >> local.properties
      - name: Unit-Tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meineschule-debug-apk
          path: app/build/outputs/apk/debug/*.apk
